[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anime-rpg-sprite-studio"
version = "0.6.0"
requires-python = ">=3.12,<3.13"
dependencies = ["PySide6>=6.7,<7", "Pillow>=10,<14", "keyring>=25,<26"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-qt>=4.4,<5"]
build = ["pyinstaller>=6.22,<7"]

[project.scripts]
anime-rpg-sprite-studio = "anime_rpg_sprite_studio.bootstrap:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.setuptools.packages.find]
where = ["src"]
